
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Cadastro de Jogos</h1>

        <form id="PetShop">

            <label>Nome do animal:</label>
            <input type="text" id="nome" required>

            <label>tipo:</label>
            <input type="text" id="tipo" required>

            <label>raça:</label>
            <input type="text" id="raca"  required>

            <label>sexo:</label>
            <input type="text" id="sexo" required>

            <label>idade:</label>
            <input type="number" id="idade" step="0.01" required>

            <label>Nome do tudo:</label>
            <input type="text" id="tutorNome" required>

             

            <label>Imagem do animal:</label>
            <input type="file" id="foto" accept="image/*" hidden>

            <button type="button" onclick="document.getElementById('foto').click()">
                Selecionar Imagem
            </button>

            <button type="submit">Salvar cachorro</button>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
